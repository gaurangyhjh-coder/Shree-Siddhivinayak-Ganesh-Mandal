<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandal Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="loginView" class="panel">
  <h1>🔐 Mandal Admin</h1>
  <p>Shree Siddhivinayak Ganesh Mitra Mandal</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Admin email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
    <p id="loginMsg" class="msg"></p>
  </form>
</div>

<div id="appView" class="hidden">
  <header>
    <div>
      <h1>🙏 Admin Dashboard</h1>
      <p id="signedInAs"></p>
    </div>
    <button id="logoutBtn" class="secondary">Logout</button>
  </header>

  <main>
    <section class="card">
      <div class="sectionHead">
        <h2>📅 Events</h2>
        <button id="newEventBtn">+ Add Event</button>
      </div>

      <form id="eventForm" class="hidden formGrid">
        <input type="hidden" id="eventId">
        <label>Title<input id="eventTitle" required></label>
        <label>Date<input id="eventDate" type="date" required></label>
        <label>Time<input id="eventTime" type="time"></label>
        <label>Location<input id="eventLocation"></label>
        <label class="full">Description<textarea id="eventDescription" rows="3"></textarea></label>
        <div class="actions full">
          <button type="submit">Save Event</button>
          <button type="button" id="cancelEventBtn" class="secondary">Cancel</button>
        </div>
        <p id="eventMsg" class="msg full"></p>
      </form>

      <div id="eventsList"></div>
    </section>

    <section class="card">
      <div class="sectionHead">
        <h2>💰 Vargani / Donations</h2>
        <button id="newDonationBtn">+ Add Donation</button>
      </div>

      <form id="donationForm" class="hidden formGrid">
        <input type="hidden" id="donationId">
        <label>Donor Name<input id="donorName" required></label>
        <label>Mobile<input id="donorMobile"></label>
        <label>Amount (₹)<input id="donorAmount" type="number" min="0" step="0.01" required></label>
        <label>Payment Mode
          <select id="paymentMode">
            <option>UPI/PhonePe</option>
            <option>Cash</option>
            <option>Bank Transfer</option>
            <option>Other</option>
          </select>
        </label>
        <label>Date<input id="donationDate" type="date" required></label>
        <label class="full">Notes<textarea id="donationNotes" rows="2"></textarea></label>
        <div class="actions full">
          <button type="submit">Save Donation</button>
          <button type="button" id="cancelDonationBtn" class="secondary">Cancel</button>
        </div>
        <p id="donationMsg" class="msg full"></p>
      </form>

      <div id="donationsList"></div>

    <section class="card">
      <div class="sectionHead">
        <h2>🛒 Expenses & Remaining Vargani</h2>
        <button id="newExpenseBtn">+ Add Expense</button>
      </div>
      <div class="balanceGrid">
        <div class="balanceBox"><span>Total Vargani</span><strong id="totalVargani">₹0.00</strong></div>
        <div class="balanceBox"><span>Total Expenses</span><strong id="totalExpenses">₹0.00</strong></div>
        <div class="balanceBox remaining"><span>Remaining Vargani</span><strong id="remainingVargani">₹0.00</strong></div>
      </div>
      <form id="expenseForm" class="hidden formGrid">
        <input type="hidden" id="expenseId">
        <label>Item / Expense<input id="expenseItem" required></label>
        <label>Amount (₹)<input id="expenseAmount" type="number" min="0" step="0.01" required></label>
        <label>Date<input id="expenseDate" type="date" required></label>
        <label class="full">Notes<textarea id="expenseNotes" rows="2"></textarea></label>
        <div class="actions full">
          <button type="submit">Save Expense</button>
          <button type="button" id="cancelExpenseBtn" class="secondary">Cancel</button>
        </div>
        <p id="expenseMsg" class="msg full"></p>
      </form>
      <div id="expensesList"></div>
    </section>
    </section>
  </main>
</div>

</body>
</html>
